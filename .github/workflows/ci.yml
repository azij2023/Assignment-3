name: Docker CI Workflow

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run training script
      run: python src/train.py

    - name: Build Docker image
      run: docker build -t azijurrahaman2015/mlops-assignment:latest .

    - name: Run container for verification
      run: docker run azijurrahaman2015/mlops-assignment:latest python src/predict.py

    - name: Log in to DockerHub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.azijurrahaman2015 }}
        DOCKERHUB_PASSWORD: ${{ secrets.sr54321 }}
      run: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

    - name: Push Docker image
      run: docker push azij2023/mlops-assignment:v1
